<style>
:root{
  --sc-canvas:#0B0B0D; --sc-surface:#131317;
  --sc-ink:#ECECEE;    --sc-ink-soft:#8B8B96;
  --sc-accent:#FF5A1F; --sc-accent-ink:#0B0B0D;
  --sc-hata:#e5484d;
  --sc-font-display: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sc-font-text: system-ui, -apple-system, "Segoe UI", sans-serif;
  --hairline: color-mix(in srgb, var(--sc-ink) 13%, transparent);
  --hairline-2: color-mix(in srgb, var(--sc-ink) 22%, transparent);
}
*{box-sizing:border-box}
input,select,textarea{accent-color:var(--sc-accent)}
body{margin:0; background:var(--sc-canvas); color:var(--sc-ink);
  font-family:var(--sc-font-text); font-size:15px; line-height:1.6}
.sayfa{max-width:860px; margin:0 auto; padding:40px 20px 80px}
h1{font-family:var(--sc-font-display); font-size:23px; letter-spacing:-.01em; margin:0 0 10px}
.ozet{color:var(--sc-ink-soft); margin:0 0 6px}
.ust-bag{font-family:var(--sc-font-display); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--sc-ink-soft); margin:0 0 26px}
.ust-bag a{color:var(--sc-accent)}
footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--hairline);
  font-size:12px; color:var(--sc-ink-soft)}
footer a{color:var(--sc-accent)}

/* ---------- araç ---------- */
.arac{border:1px solid var(--hairline); background:var(--sc-surface); padding:16px; margin:24px 0}
.arac input{width:100%; background:var(--sc-canvas); border:1px solid var(--hairline);
  color:var(--sc-ink); padding:8px 10px; font:inherit; font-size:14px}
.arac input:focus{outline:none; border-color:var(--sc-accent)}
.arac__alanlar{display:flex; flex-wrap:wrap; gap:12px; margin-top:18px}
.arac__alanlar label{flex:1 1 170px; font-family:var(--sc-font-display); font-size:11px;
  color:var(--sc-ink-soft); text-transform:uppercase; letter-spacing:.06em}
.arac__alanlar input{margin-top:6px}
.arac__not{margin-top:8px; font-size:12px; color:var(--sc-ink-soft)}
.arac__uyari{margin-top:12px; font-size:13px; color:var(--sc-hata)}
.arac__dugmeler{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.arac__dugmeler button{background:none; border:1px solid var(--hairline-2); color:var(--sc-ink);
  padding:9px 14px; font:inherit; font-size:12px; cursor:pointer;
  font-family:var(--sc-font-display); letter-spacing:.04em}
.arac__dugmeler button:hover:not(:disabled){border-color:var(--sc-accent); color:var(--sc-accent)}
.arac__dugmeler button:disabled{opacity:.4; cursor:default}

.arac__blok{display:block; font-family:var(--sc-font-display); font-size:11px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--sc-ink-soft); margin-bottom:14px}
.arac__blok b{color:var(--sc-ink)}
.arac__blok textarea{width:100%; margin-top:8px; background:var(--sc-canvas);
  border:1px solid var(--hairline); color:var(--sc-ink); padding:10px; font:inherit;
  font-family:ui-monospace,monospace; font-size:13px; text-transform:none; letter-spacing:0}
.arac select{width:100%; margin-top:6px; background:var(--sc-canvas); border:1px solid var(--hairline);
  color:var(--sc-ink); padding:9px 10px; font:inherit; font-size:14px}
.arac__onay{display:flex; align-items:center; gap:7px; flex:0 0 auto; align-self:end;
  padding-bottom:9px; text-transform:none; letter-spacing:0; font-size:13px}
.arac__onay input{width:auto; margin:0}
.arac__sayi{font-family:var(--sc-font-display); font-size:12px; color:var(--sc-ink-soft);
  align-self:center; margin-inline-end:auto}
ul.arac__uyari{margin:12px 0 0 18px; padding:0}
ul.arac__uyari li{font-size:13px; color:var(--sc-hata)}
.arac__hazir{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px;
  font-family:var(--sc-font-display); font-size:11px; color:var(--sc-ink-soft)}
.arac__hazir button{padding:4px 10px; border:1px solid var(--hairline); background:none;
  color:var(--sc-ink-soft); font:inherit; cursor:pointer; border-radius:999px}
.arac__hazir button:hover{color:var(--sc-ink); border-color:var(--sc-ink-soft)}
[hidden]{display:none !important}
/* Dil şeridi: metin adları, bayrak değil. Bayrak dili değil ülkeyi anlatıyor. */
.diller{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 26px}
.diller button{padding:4px 11px; border:1px solid var(--hairline); background:none;
  color:var(--sc-ink-soft); font-family:var(--sc-font-display); font-size:11px;
  letter-spacing:.05em; cursor:pointer; border-radius:999px;
  transition:color .18s, border-color .18s, background .18s}
.diller button:hover{color:var(--sc-ink); border-color:var(--sc-ink-soft)}
.diller button[aria-pressed="true"]{color:var(--sc-accent-ink); background:var(--sc-accent);
  border-color:var(--sc-accent)}
.arac__alanlar label span{display:block}
/* Ürün listesi soldan sağa VE sola yaslı: sütunlar tabloya yapıştırıldığı
   sırayla dursun — insanlar bu listeyi Excel'den kopyalıyor. Sağa yaslı
   bırakılınca sütunlar ters okunuyordu. */
[dir="rtl"] #ham{direction:ltr; text-align:left}
/* Ölçü kutularında tek sayı var; yön soldan sağa, hizası sayfayla aynı. */
[dir="rtl"] .arac__alanlar input{direction:ltr; text-align:right}
/* Etiketlerin kendisi baskı çıktısı — sayfa yönünden etkilenmemeli. */
.etiketler-kutu{direction:ltr}

/* Önizleme kutusu ekranda kayıyor; 500 etiketlik bir liste sayfayı metrelerce
   uzatmasın diye. Baskıda kutu şeffaflaşıyor (aşağıdaki @media print). */
.etiketler-kutu{margin-top:20px; max-height:70vh; overflow:auto; background:#fff;
  border:1px solid var(--hairline)}
.etiketler{display:grid; grid-template-columns:repeat(var(--ets),var(--etg));
  gap:0; background:#fff; padding:6mm 4mm; justify-content:center}
/* Rulo modunda tek sütun: her etiket kendi sayfasına gidiyor. */
.etiketler--rulo{grid-template-columns:var(--etg); padding:4mm; gap:3mm}
/* Ekranda ilk 20; "hepsini göster" açılınca hepsi. Baskıya HER ZAMAN hepsi
   gidiyor — DOM'da hepsi duruyor, gizleme yalnızca ekran kuralı. */
.etiketler:not(.etiketler--acik) > .etiket:nth-child(n+21){display:none}
.etiket{width:var(--etg); height:var(--ety); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1mm; padding:var(--etic,1.5mm);
  color:#000; overflow:hidden; box-sizing:border-box; outline:1px dashed #ddd}
.etiket__ad{font-size:calc(9px * var(--et-olcek,1)); font-weight:var(--et-kalin,600);
  font-style:var(--et-egik,normal);
  text-align:center; line-height:1.15; max-height:2.4em; overflow:hidden}
.etiket__fiyat{font-size:calc(13px * var(--et-olcek,1)); font-weight:800}
/* viewBox JS'te yazılıyor; burada svg tam genişliği kaplayıp oranıyla
   yükseklik alıyor. */
.etiket svg{display:block; width:100%; height:auto; max-height:100%}
.etiket--yan-yana .etiket__satir{display:flex; align-items:baseline;
  justify-content:space-between; gap:2mm; width:100%}
.etiket--yan-yana .etiket__ad{text-align:left; max-height:1.3em}
.etiket--sade{justify-content:center}

/* Baskı: sayfada YALNIZCA etiketler kalsın. Her şey kapanıyor, yalnızca etiket
   kutusunun ata zinciri `:has()` ile geri açılıyor — sayfa yapısı değişse de
   kural bozulmuyor. */
@media print{
  body *{display:none !important}
  *:has(.baski-alani){display:block !important; border:none !important;
    background:none !important; padding:0 !important; margin:0 !important}
  /* Kutunun İÇİNDEKİ HER ŞEY tarayıcı varsayılanına dönüyor. Yalnızca
     `.etiket svg{display:block}` yazılsaydı svg'nin İÇİNDEKİ rect ve text
     düğümleri `body *` kuralından display:none kalır, PDF'te barkodlar boş
     çıkardı. `revert` o düğümleri de geri açıyor. */
  .baski-alani, .baski-alani *{display:revert !important}
  .baski-alani{display:block !important; max-height:none !important;
    overflow:visible !important; border:none !important; margin:0 !important}
  .etiketler{display:grid !important; margin:0; padding:0; background:#fff}
  /* Ekrandaki önizleme kırpması baskıyı ETKİLEMEZ. */
  .etiketler > .etiket{display:flex !important; outline:none}
  /* `revert` svg'yi satır içi yapıyor; ortalamayı geri kuruyoruz. */
  .etiket svg{display:block !important; margin:0 auto !important}
  .etiket--yan-yana .etiket__satir{display:flex !important}
  /* Rulo baskısında KAP da etiket genişliğine sabitleniyor. Kap serbest
     bırakılınca sayfadan geniş kalıyor ve Chrome "sığdır" için TÜM içeriği
     küçültüyor — küçültmeyi sol üstten yaptığı için etiket sola yaslı çıkıyor. */
  html,body{width:auto !important; min-width:0 !important;
    margin:0 !important; padding:0 !important}
  .baski-alani:has(.etiketler--rulo){
    width:var(--etg) !important; max-width:var(--etg) !important}
  .etiketler--rulo{padding:0; gap:0;
    width:var(--etg) !important; max-width:var(--etg) !important;
    grid-template-columns:var(--etg) !important}
  .etiketler--rulo > .etiket{break-after:page}
  .etiketler--rulo > .etiket:last-child{break-after:auto}
  @page{size:A4; margin:6mm 4mm}
}

<body>
<main class="sayfa">
  <h1 data-t="h1"></h1>
  <p class="ozet" data-t="ozet"></p>
  <p class="ust-bag">
    <a href="https://hanzala.com.tr/araclar/barkod-etiket-olusturucu">hanzala.com.tr</a>
    · <span data-t="ucretsiz"></span>
  </p>

  <nav class="diller" id="diller" aria-label="Dil"></nav>

  <div class="arac">
    <!-- Rulo modunda her etiket kendi sayfası; @page ölçüsü inline style ile
         verilemiyor, bu yüzden kural etiket boyu değiştikçe buraya basılıyor. -->
    <style id="sayfaKurali"></style>

    <label class="arac__blok">
      <span id="girdiAnlat"></span>
      <textarea id="ham" rows="6"></textarea>
    </label>

    <div class="arac__alanlar">
      <label><span data-t="cikti"></span>
        <select id="mod">
          <option value="tabaka" data-t="modTabaka"></option>
          <option value="rulo" data-t="modRulo"></option>
        </select>
      </label>

      <label id="tabakaAlan"><span data-t="tabakaSec"></span>
        <select id="tabaka"></select>
      </label>

      <label class="ruloAlan" hidden><span data-t="en"></span>
        <input id="ozelG" inputmode="decimal" value="50">
      </label>
      <label class="ruloAlan" hidden><span data-t="boy"></span>
        <input id="ozelY" inputmode="decimal" value="30">
      </label>
      <label class="ruloAlan" hidden><span data-t="icBosluk"></span>
        <input id="ozelIc" inputmode="decimal" value="2">
      </label>

      <label><span data-t="barkodTipi"></span>
        <select id="tip">
          <option value="EAN13" data-t="tipEan"></option>
          <option value="CODE128" data-t="tipCode"></option>
        </select>
      </label>
      <label><span data-t="duzen"></span>
        <select id="sablon"></select>
      </label>
      <label><span data-t="yaziOlcegi"></span>
        <input id="punto" type="range" min="0.6" max="2" step="0.1" value="1">
      </label>
      <label class="arac__onay"><input id="adGoster" type="checkbox" checked> <span data-t="onayAd"></span></label>
      <label class="arac__onay"><input id="fiyatGoster" type="checkbox" checked> <span data-t="onayFiyat"></span></label>
      <label class="arac__onay"><input id="kalin" type="checkbox" checked> <span data-t="onayKalin"></span></label>
      <label class="arac__onay"><input id="egik" type="checkbox"> <span data-t="onayEgik"></span></label>
    </div>

    <div class="arac__hazir" id="ruloHazir" hidden><span data-t="hazirOlculer"></span></div>

    <ul class="arac__uyari" id="hatalar" hidden></ul>
    <p class="arac__uyari" id="kirpma" hidden></p>

    <div class="arac__dugmeler">
      <span class="arac__sayi" id="sayac"></span>
      <button id="hepsi" type="button" hidden></button>
      <button id="yazdir" type="button" data-t="yazdir"></button>
    </div>
    <p class="arac__not" id="onizlemeNot" hidden></p>

    <!-- Ölçüler DIŞ kutuda: baskıda kabın kendisi de etiket genişliğine
         sabitlenmeli, yoksa Chrome sayfayı sığdırmak için her şeyi küçültüyor. -->
    <div class="etiketler-kutu baski-alani" id="kutu">
      <div class="etiketler" id="etiketler"></div>
    </div>
  </div>

  <footer data-t="altbilgi"></footer>
</main>

/** Girilen dili doğrular; tanımadığını Türkçeye düşürür. */
const dilCoz = (istenen) => (DILLER.includes(istenen) ? istenen : 'tr')

/** '{a} ve {b}' → değerlerle doldurur. */
const doldur = (kalip, d) =>
  Object.entries(d).reduce((m, [k, v]) => m.replaceAll('{' + k + '}', v), kalip)

/* A4 210×297 mm. Etiket ölçüleri piyasadaki yaygın tabakalara göre. */
/* Adlar dile göre üretiliyor (METIN.tabakaAd); burada yalnızca ölçüler. */
const TABAKA = [
  { g: 70, y: 37, sutun: 3, satir: 8 },
  { g: 105, y: 37, sutun: 2, satir: 8 },
  { g: 52.5, y: 29.7, sutun: 4, satir: 10 },
  { g: 38, y: 21, sutun: 5, satir: 13 },
  { g: 105, y: 74, sutun: 2, satir: 4 },
]
/* Termal etiket yazıcılarında yaygın rulo ölçüleri — hazır başlangıç noktası. */
const RULO_HAZIR = [
  { g: 40, y: 25 }, { g: 50, y: 30 }, { g: 58, y: 40 }, { g: 100, y: 50 },
]
/* Etiket düzenleri. Sıralama ve vurgu değişiyor, ölçü değişmiyor.
   Adlar METIN.sablonlar'da, sıraları bu diziyle aynı.

   'fiyat-baskin' KALDIRILDI: fiyatı öne çıkaran etiket raf etiketinin işi,
   burada barkod okutuluyor. İki araç aynı şeyi yapmasın diye ayrıldılar. */
const SABLON = ['ad-ustte', 'yan-yana', 'sade']
/* Ekranda kaç etiket çizilsin. Baskıya HEPSİ gidiyor; bu yalnızca önizleme. */
const ONIZLEME = 20
/* Üstünde tarayıcı SVG çizmekte zorlanıyor; sessizce kırpmıyoruz, uyarı basıyoruz. */
const TAVAN = 500

/** EAN-13 kontrol hanesi: tek konumlar ×1, çift konumlar ×3, toplamın 10'a tümleyeni. */
const ean13Hane = (on2) => {
  const d = on2.split('').map(Number)
  const t = d.reduce((s, n, i) => s + n * (i % 2 === 0 ? 1 : 3), 0)
  return String((10 - (t % 10)) % 10)
}

/**
 * Satırı sütunlara böler.
 *
 * Virgül SON çare: Türkçe fiyat "145,90" yazılıyor ve virgülü ayraç saymak
 * fiyatı 145, adedi 90 yapıyordu — kullanıcı tek etiket isterken sessizce 90
 * etiket basılıyordu. Satırda sekme, noktalı virgül veya boru varsa ayraç
 * odur; yoksa virgüle düşülür.
 */
const bol = (satir) => {
  const ayrac = /[\t;|]/.test(satir) ? /[\t;|]/ : /,/
  return satir.split(ayrac).map((x) => x.trim())
}

const ayikla = (ham) =>
  ham.split('\n').map((s) => s.trim()).filter(Boolean).map((s) => {
    const p = bol(s)
    return {
      ad: p[0] || '',
      adet: Math.max(1, Math.min(99, Number(p[3]) || 1)),
      fiyat: p[2] || '',
      kod: (p[1] || '').replace(/\s/g, ''),
    }
  })

const sayi = (x, alt, ust, varsayilan) => {
  const n = Number(String(x).replace(',', '.'))
  return Number.isFinite(n) && n >= alt && n <= ust ? n : varsayilan
}

/** Ham satırlara barkod tipini uygular; düzeltilebileni düzeltir, olmayanı işaretler. */
/** Uyarı metni DEĞİL, anahtar döndürüyor: metin dile göre sonra kuruluyor. */
const hazirla = (satirlar, tip) => satirlar.map((s) => {
  let kod = s.kod, uyari = null
  if (tip === 'EAN13') {
    const rakam = kod.replace(/\D/g, '')
    if (rakam.length === 12) kod = rakam + ean13Hane(rakam)
    else if (rakam.length === 13) {
      kod = rakam
      if (ean13Hane(rakam.slice(0, 12)) !== rakam[12]) uyari = { anahtar: 'hataKontrol' }
    } else uyari = { anahtar: 'hataHane', n: rakam.length }
  }
  return { ...s, kod, uyari }
})

/* ---- kendi kendini sınama: index.html?test=1 ---- */
if (new URLSearchParams(location.search).has('test')) {
  const esit = (a, b, ad) => {
    const ok = JSON.stringify(a) === JSON.stringify(b)
    document.title = ok ? document.title : 'HATA: ' + ad
    console[ok ? 'log' : 'error'](ok ? 'gecti' : 'KALDI', ad, a, b)
    if (!ok) throw new Error(ad)
  }
  esit(ean13Hane('869000000001'), '2', 'kontrol hanesi')
  esit(ean13Hane('590123412345'), '7', 'kontrol hanesi 2')
  // Virgüllü fiyat ayraç sayılmamalı: sekme varsa ayraç sekmedir.
  esit(ayikla('Çay\t8690000000012\t145,90')[0], 
       { ad: 'Çay', adet: 1, fiyat: '145,90', kod: '8690000000012' }, 'sekme ayracı')
  esit(ayikla('Çay,869,20,3')[0].adet, 3, 'virgül ayracı')
  esit(hazirla(ayikla('x\t869000000001\t5'), 'EAN13')[0].kod, '8690000000012', '12 haneye kontrol eklenir')
  esit(hazirla(ayikla('x\t8690000000013\t5'), 'EAN13')[0].uyari.anahtar, 'hataKontrol', 'yanlış kontrol hanesi')
  esit(hazirla(ayikla('x\tABC-123\t5'), 'CODE128')[0].uyari, null, 'Code 128 harf alır')
  esit(dilCoz('ar'), 'ar', 'bilinen dil')
  esit(dilCoz('fr'), 'tr', 'bilinmeyen dil Türkçeye düşüyor')
  esit(doldur('{a} ve {b}', { a: 1, b: 2 }), '1 ve 2', 'yer tutucu dolduruluyor')
  // Her dilde aynı anahtarlar olmalı; eksik anahtar boş etiket demek.
  const anahtar = Object.keys(METIN.tr).sort()
  DILLER.forEach((d) => {
    esit(Object.keys(METIN[d]).sort(), anahtar, d + ' anahtarları tam')
    esit(METIN[d].sablonlar.length, SABLON.length, d + ' düzen adları tam')
  })
  console.log('tüm sınamalar geçti')
}

let hamDokunuldu = false      // örnek liste yalnızca kullanıcı yazmadıysa değişiyor
let dil = dilCoz(new URLSearchParams(location.search).get('dil')
  || navigator.language?.slice(0, 2))

/** Ölçüyü dilin ondalık ayracıyla yazar: 52,5 / 52.5 */
const olcu = (n) => n.toLocaleString(YORE[dil])

$('sablon').innerHTML = SABLON.map((a) => `<option value="${a}"></option>`).join('')
$('tabaka').innerHTML = TABAKA.map((_, i) => `<option value="${i}"></option>`).join('')

  b.onclick = () => { dil = d; uygulaDil(); ciz() }
  $('diller').append(b)
})

function uygulaDil() {
  const m = t()
  document.documentElement.lang = dil
  document.documentElement.dir = RTL.includes(dil) ? 'rtl' : 'ltr'
  document.title = m.baslik
  document.querySelector('meta[name=description]').content = m.aciklama
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = m[e.dataset.t] })
  // Girdi anlatımında kalın yazılmış sütun adları var, o yüzden innerHTML.
  $('girdiAnlat').innerHTML = m.girdiAnlat
  if (!hamDokunuldu) ham.value = m.ornek

  $('tabaka').querySelectorAll('option').forEach((o, i) => {
    const x = TABAKA[i]
    o.textContent = doldur(m.tabakaAd, {
      g: olcu(x.g), y: olcu(x.y), s: x.sutun, r: x.satir, n: x.sutun * x.satir,
    })
  })
  $('sablon').querySelectorAll('option')
    .forEach((o, i) => { o.textContent = m.sablonlar[i] })
  $('ruloHazir').querySelectorAll('button')
    .forEach((b, i) => {
      b.textContent = `${olcu(RULO_HAZIR[i].g)}×${olcu(RULO_HAZIR[i].y)} ${m.mm}`
    })
  $('diller').querySelectorAll('button')
    .forEach((b, i) => b.setAttribute('aria-pressed', String(DILLER[i] === dil)))

  // Alt bilgideki iki bağlantı metin içinde: {site} ve {araclar} yer tutucuları.
  const bag = (yol, yazi) => `<a href="https://hanzala.com.tr${yol}">${yazi}</a>`
  document.querySelector('footer').innerHTML = m.altbilgi
    .replace('{site}', bag('', m.altSite))
    .replace('{araclar}', bag('/araclar', m.altAraclar))

  // Adres çubuğu dili taşısın: bağlantı paylaşılınca aynı dil açılsın.
  const u = new URL(location.href)
  dil === 'tr' ? u.searchParams.delete('dil') : u.searchParams.set('dil', dil)
  history.replaceState(null, '', u)
}

function ciz() {
  const mod = $('mod').value
  const tip = $('tip').value
  const sablon = $('sablon').value
  const tabaka = Number($('tabaka').value) || 0

  $('tabakaAlan').hidden = mod !== 'tabaka'
  document.querySelectorAll('.ruloAlan').forEach((e) => { e.hidden = mod !== 'rulo' })
  $('ruloHazir').hidden = mod !== 'rulo'

  // Ölçü: tabaka modunda hazır tabakadan, rulo modunda kullanıcıdan.
  const g = mod === 'tabaka' ? TABAKA[tabaka].g : sayi($('ozelG').value, 10, 210, 50)
  const y = mod === 'tabaka' ? TABAKA[tabaka].y : sayi($('ozelY').value, 8, 297, 30)
  const ic = mod === 'tabaka' ? 1.5 : sayi($('ozelIc').value, 0, 20, 2)
  const sutun = mod === 'tabaka' ? TABAKA[tabaka].sutun : 1
  $('sayfaKurali').textContent =
    mod === 'rulo' ? `@media print{@page{size:${g}mm ${y}mm;margin:0}}` : ''

  const hazir = hazirla(ayikla(ham.value), tip)
  const hatali = hazir.filter((x) => x.uyari)
  $('hatalar').hidden = !hatali.length
  const m = t()
  $('hatalar').innerHTML = hatali
    .map((x) => `<li>${(x.ad || m.adsiz).replace(/</g, '&lt;')}: ${doldur(m[x.uyari.anahtar], x.uyari)}</li>`)
    .join('')

  // Kopya adedi burada açılıyor: aynı ürün adet kadar etiket oluyor.
  const tum = hazir.filter((x) => x.kod && !x.uyari)
    .flatMap((x) => Array.from({ length: x.adet }, () => x))
  const kirpildi = Math.max(0, tum.length - TAVAN)
  const etiketler = tum.slice(0, TAVAN)

  $('kirpma').hidden = !kirpildi
  $('kirpma').textContent = kirpildi
    ? doldur(m.kirpma, { tum: tum.length, tavan: TAVAN, kalan: kirpildi }) : ''

  $('sayac').textContent = doldur(m.sayac, { n: etiketler.length }) +
    (mod === 'rulo' ? doldur(m.sayacRulo, { g: olcu(g), y: olcu(y) }) : '')
  $('hepsi').hidden = etiketler.length <= ONIZLEME
  $('hepsi').textContent = hepsiniGoster
    ? doldur(m.ilkGoster, { n: ONIZLEME })
    : doldur(m.hepsiniGoster, { n: etiketler.length })
  $('yazdir').disabled = !etiketler.length
  $('onizlemeNot').hidden = !(etiketler.length > ONIZLEME && !hepsiniGoster)
  $('onizlemeNot').textContent =
    doldur(m.onizlemeNot, { o: ONIZLEME, n: etiketler.length })

  const olcek = sayi($('punto').value, 0.6, 2, 1)
  Object.entries({
    '--et-egik': $('egik').checked ? 'italic' : 'normal',
    '--et-kalin': $('kalin').checked ? '700' : '400',
    '--et-olcek': olcek,
    '--etg': g + 'mm', '--ety': y + 'mm', '--etic': ic + 'mm', '--ets': sutun,
  }).forEach(([k, v]) => kutu.style.setProperty(k, v))

  etiketlerEl.className = 'etiketler etiketler--' + mod + (hepsiniGoster ? ' etiketler--acik' : '')
  const adGoster = $('adGoster').checked, fiyatGoster = $('fiyatGoster').checked
  etiketlerEl.replaceChildren(...etiketler.map((x) => {
    const el = document.createElement('div')
    el.className = 'etiket etiket--' + sablon
    const kac = (s) => String(s).replace(/</g, '&lt;')
    const ad = adGoster && x.ad ? `<span class="etiket__ad">${kac(x.ad)}</span>` : ''
    const fiyat = !fiyatGoster || !x.fiyat ? ''
      : `<span class="etiket__fiyat">${kac(x.fiyat)} ₺</span>`
    const kodu = `<svg data-kod="${kac(x.kod)}"></svg>`
    el.innerHTML =
      sablon === 'sade' ? kodu
      : sablon === 'yan-yana' ? `<span class="etiket__satir">${ad}${fiyat}</span>${kodu}`
      : `${ad}${kodu}${fiyat}`
    return el
  }))

  cizBarkod(y, tip)
}

/** Barkod yüksekliği etiket boyuna göre; küçük etikette çubuk taşmasın. */
function cizBarkod(y, tip) {
  if (typeof JsBarcode !== 'function') return
  const yukseklik = Math.max(14, Math.min(60, Math.round((y - 2 * 1.5) * 2.2)))
  etiketlerEl.querySelectorAll('svg[data-kod]').forEach((el) => {
    try {
      // Sessiz bölge ŞART: EAN-13 solda 9, sağda 7 modül boşluk istiyor ve ilk
      // hane çubukların SOLUNA basılıyor. margin:0 iken o hane kırpılıyor ve
      // çubuklar etiket kenarına dayanıyordu (basılan PDF'te ölçüldü).
      JsBarcode(el, el.getAttribute('data-kod'), {
        background: 'transparent', displayValue: true, fontSize: y < 25 ? 9 : 12,
        format: tip, height: yukseklik, lineColor: '#000',
        marginBottom: 0, marginLeft: 14, marginRight: 14, marginTop: 0,
      })
      // jsbarcode viewBox YAZMIYOR; yalnızca width/height nitelikleri koyuyor.
      // viewBox yokken CSS ile kutuyu daraltmak içindeki çizimi ölçeklemiyor —
      // çizim doğal boyutunda kalıp sola yapışıyor. Ekranda etiket geniş olduğu
      // için görünmüyordu, baskıda 58mm'ye sıkışınca sola yaslı çıkıyordu.
      const g0 = parseFloat(el.getAttribute('width') || '0')
      const y0 = parseFloat(el.getAttribute('height') || '0')
      if (g0 > 0 && y0 > 0) {
        el.setAttribute('viewBox', `0 0 ${g0} ${y0}`)
        el.setAttribute('preserveAspectRatio', 'xMidYMid meet')
        el.removeAttribute('width'); el.removeAttribute('height')
      }
    } catch { el.innerHTML = '' }
  })
}

document.querySelectorAll('.arac input, .arac select, .arac textarea')
  .forEach((e) => e.addEventListener('input', ciz))
ham.addEventListener('input', () => { hamDokunuldu = true })

$('yazdir').onclick = () => window.print()

ciz()
</script>
